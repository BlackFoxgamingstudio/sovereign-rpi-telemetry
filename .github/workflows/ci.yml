name: CI / Automated Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Suite & CLI Verification
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Check out repository
      uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install -e .

    - name: Run Test Suite
      run: |
        pytest tests/test_solution.py -v

    - name: Run Direct Python Tests (Zero Dependencies)
      run: |
        python3 tests/test_solution.py

    - name: Verify CLI Health & Polling
      run: |
        python3 src/cli.py --health
        python3 src/cli.py --poll --format json

  docker:
    name: Docker Container Build
    runs-on: ubuntu-latest
    needs: test
    steps:
    - name: Check out repository
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: actions/setup-buildx-action@v3

    - name: Build Docker Image
      run: |
        docker build -t sovereign-rpi-telemetry:latest .

  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ghcr.io/blackfoxgamingstudio/sovereign-rpi-telemetry:latest
            ghcr.io/blackfoxgamingstudio/sovereign-rpi-telemetry:${{ github.sha }}
